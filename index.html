<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Laddu ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

.container{
text-align:center;
z-index:2;
}

h1{
font-size:55px;
color:white;
margin-bottom:20px;
text-shadow:2px 2px 10px black;
}

button{
padding:18px 40px;
font-size:22px;
border:none;
border-radius:40px;
cursor:pointer;
background:#ff4081;
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.1);
background:#ff0055;
}

.flower{
position:absolute;
font-size:35px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-100px);
}
100%{
transform:translateY(110vh);
}
}

</style>

</head>

<body>

<div class="container">

<h1>💖 Hi Laddu 💖</h1>

<button onclick="startLove()">
Open Your Surprise ❤️
</button>

</div>

<script>

function startLove(){

alert("Welcome My Laddu ❤️");
}

for(let i=0;i<60;i++){

let flower=document.createElement("div");

flower.className="flower";

flower.innerHTML=Math.random()>0.5?"🌹":"🌸";

flower.style.left=Math.random()*100+"vw";

flower.style.animationDuration=5+Math.random()*6+"s";

flower.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(flower);

}

</script>

</body>
</html>
