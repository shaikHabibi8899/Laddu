<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For My Laddu ❤️</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ff9a9e,#fad0c4);display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#fff;padding:25px;border-radius:20px;max-width:500px;width:92%;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.2)}
button{padding:12px 18px;border:none;border-radius:30px;background:#ff4081;color:#fff;font-size:18px;cursor:pointer;margin:8px;width:100%}
input{padding:10px;width:90%;border-radius:20px;border:2px solid #ff4081}
.flower{position:fixed;top:-30px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style></head><body>
<audio id="bgMusic" loop><source src="love-song.mp3" type="audio/mpeg"></audio>
<div class="box" id="app">
<h2>💖 Hi Laddu 💖</h2>
<div id="content"></div>
</div>
<script>
const phone="919985286232";
const qs=[
["What do you want to eat right now? 😋",["Ice Cream 🍦","Chocolate 🍫"]],
["What do you want to drink right now? 🥤",["Badampalu 🥛","Other Juice 🍹"],true],
["When you look at me, what's the first thing you feel? 🥺❤️",["Safe & at home 🏡","Heart skips beats 💓"]],
["What makes you smile about me? 🥰",["Our talks 💬","Your care 🤗"]],
["Freeze one moment forever? ⏳",["Late-night chats 🌙","Holding hands 🤝"]],
["How much do you miss me? 🥺",["Every second ⏰","Always 💭"]],
["Perfect evening? 🌅",["Sunset together 🌇","One blanket 🧸"]],
["Do you know how special you are? ❤️",["Yes ✨","Tell me again 🙈"]],
["Promise forever? 💍",["Never leave your hand 🫂","Make you laugh 👵👴"]],
["Will you stay my happiness? ❤️",["Forever ♾️","Always 💕"]]
];
let i=0,ans=[];
function start(){bgMusic.volume=.3;bgMusic.play();next();}
function next(){
if(i>=qs.length){finish();return;}
let q=qs[i],h='<h3>'+q[0]+'</h3>';
if(q[2]){
h+='<button onclick="pick(\'Badampalu 🥛\')">Badampalu 🥛</button><button onclick="other()">Other Juice 🍹</button>';
}else q[1].forEach(o=>h+='<button onclick="pick(`'+o+'`)">'+o+'</button>');
content.innerHTML=h;
}
function other(){content.innerHTML='<h3>'+qs[i][0]+'</h3><input id=t placeholder="Type juice"><button onclick="pick(document.getElementById(\'t\').value)">Next</button>'}
function pick(a){ans.push([qs[i][0],a]);i++;next();}
function finish(){
let s='<h2>💝 Your Choices 💝</h2>';ans.forEach(x=>s+='<p><b>'+x[0]+'</b><br>'+x[1]+'</p>');
s+='<button onclick="wa()">Send via WhatsApp 💬</button><hr><p><b>Laddu ❤️</b><br>I LOVE YOU.<br>This is my first website made just for you. Maybe it isn't perfect, but my love for you is. ❤️</p>';
content.innerHTML=s;
}
function wa(){
let m='My answers:%0A%0A';
ans.forEach(x=>m+='• '+x[0]+' -> '+x[1]+'%0A');
open('https://wa.me/'+phone+'?text='+m);
}
content.innerHTML='<button onclick="start()">Open Your Surprise ❤️</button>';
for(let k=0;k<50;k++){let f=document.createElement('div');f.className='flower';f.innerHTML=Math.random()>.5?'🌹':'🌸';f.style.left=Math.random()*100+'vw';f.style.animationDuration=5+Math.random()*5+'s';document.body.appendChild(f);}
</script></body></html>
